# Circle packing (n=26) on Amazon Bedrock — the standard AlphaEvolve smoke test.
# AlphaEvolve reported sum of radii 2.635; OpenEvolve matched it to 2.634.
#
# Run:   oe-bedrock run initial_program.py evaluator.py --config config.yaml --iterations 100
# Cost:  oe-bedrock cost openevolve_output/ --pricing ../../pricing.yaml --threshold 0.99
#        (combined_score = sum_radii / 2.635, so 0.99 ~= 2.609)
#
# Model ids below are cross-region inference profiles. Confirm what is enabled in
# your account/region with `oe-bedrock models --profiles --vendor anthropic`.

max_iterations: 100
checkpoint_interval: 10
log_level: "INFO"
random_seed: 42

llm:
  provider: bedrock
  api_base: aws://us-west-2            # Converse API (SigV4 / IAM / Bedrock API key)
  # --- or the OpenAI-compatible Mantle endpoint (same models, different throughput model):
  # api_base: https://bedrock-mantle.us-west-2.api.aws/v1
  # api_key: "${AWS_BEARER_TOKEN_BEDROCK}"
  models:
    - name: us.anthropic.claude-haiku-5-5    # breadth: most mutations
      weight: 0.8
    - name: us.anthropic.claude-sonnet-5-5   # depth: occasional strong mutation
      weight: 0.2
    # Any Bedrock text model works, from any vendor (`oe-bedrock models --profiles`).
    # Alternatives for the ensemble-mix experiment (see bench/matrix.py):
    # - name: openai.gpt-oss-120b-1:0
    # - name: qwen.qwen3-coder-480b-a35b-v1:0
    # - name: deepseek.v3.2
    # - name: mistral.devstral-2-123b
  temperature: 0.7
  max_tokens: 8192
  timeout: 600

prompt:
  system_message: |
    You are an expert mathematician specializing in circle packing problems and computational geometry. Your task is to improve a constructor function that directly produces a specific arrangement of 26 circles in a unit square, maximizing the sum of their radii. The AlphaEvolve paper achieved a sum of 2.635 for n=26.

    Key geometric insights:
    - Circle packings often follow hexagonal patterns in the densest regions
    - Maximum density for infinite circle packing is pi/(2*sqrt(3)) ≈ 0.9069
    - Edge effects make square container packing harder than infinite packing
    - Circles can be placed in layers or shells when confined to a square
    - Similar radius circles often form regular patterns, while varied radii allow better space utilization
    - Perfect symmetry may not yield the optimal packing due to edge effects

    Focus on designing an explicit constructor that places each circle in a specific position, rather than an iterative search algorithm.
  num_top_programs: 3
  use_template_stochasticity: true

database:
  population_size: 60
  archive_size: 25
  num_islands: 4
  elite_selection_ratio: 0.3
  exploitation_ratio: 0.7

evaluator:
  timeout: 60
  cascade_evaluation: true
  cascade_thresholds: [0.5, 0.75]
  parallel_evaluations: 4
  use_llm_feedback: false

diff_based_evolution: false
allow_full_rewrites: true

# Function minimization on Amazon Bedrock — the cheapest end-to-end check
# (10 iterations, small prompts). Use it to confirm credentials, model access
# and the ledger before spending on circle packing.
#
#   oe-bedrock run initial_program.py evaluator.py --config config.yaml
#   oe-bedrock cost openevolve_output/ --pricing ../../pricing.yaml

max_iterations: 10
checkpoint_interval: 5
random_seed: 42

llm:
  provider: bedrock
  api_base: aws://us-west-2
  models:
    - name: us.anthropic.claude-haiku-5-5
      weight: 0.8
    - name: us.anthropic.claude-sonnet-5-5
      weight: 0.2
  temperature: 0.7
  max_tokens: 16000
  timeout: 120

prompt:
  system_message: "You are an expert programmer specializing in optimization algorithms. Your task is to improve a function minimization algorithm to find the global minimum of a complex function with many local minima. The function is f(x, y) = sin(x) * cos(y) + sin(x*y) + (x^2 + y^2)/20. Focus on improving the search_algorithm function to reliably find the global minimum, escaping local minima that might trap simple algorithms."

database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  similarity_threshold: 0.99

evaluator:
  timeout: 60
  cascade_thresholds: [1.3]
  parallel_evaluations: 3

diff_based_evolution: true
max_code_length: 20000

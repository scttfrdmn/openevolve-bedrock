# Stand-in run (issue #46): fake model, stand-in evaluator, no AWS.
#
#   S=$(python -c "import openevolve_bedrock.standin as s, os; print(os.path.dirname(s.__file__))")
#   oe-bedrock run $S/initial_program.py $S/evaluator.py --config $S/config.yaml --iterations 200
max_iterations: 200
checkpoint_interval: 20
log_level: "WARNING"
random_seed: 42
language: "python"
diff_based_evolution: false
max_code_length: 10000

llm:
  provider: oeb-fake
  models:
    - name: oeb-fake
      weight: 1.0

prompt:
  system_message: "Improve the stand-in kernel's CONFIG without breaking correctness."
  num_top_programs: 2

database:
  population_size: 30
  archive_size: 15
  num_islands: 2

evaluator:
  cascade_evaluation: true
  cascade_thresholds: [0.5]
  parallel_evaluations: 2
  timeout: 60
  use_llm_feedback: false

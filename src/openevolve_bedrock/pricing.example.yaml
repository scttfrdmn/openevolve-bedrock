# Keys: input, output (required); cache_read, cache_write (optional, default 0).
# Model ids may be given with or without a cross-region prefix (us., eu., ...);
# the ledger's id is matched exactly first, then with the prefix stripped.
# Rows with null input/output are ignored (treated as unpriced).

